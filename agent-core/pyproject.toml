[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-agent-core"
version = "0.1.0"
description = "Standalone Laya-per-agent runtime for Agent Workbench"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "aiosqlite>=0.20,<1",
  "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]
